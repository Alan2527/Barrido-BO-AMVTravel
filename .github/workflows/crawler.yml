name: 🕷️ QA Crawler Moneda (Test1)

# ¿Cuándo se va a ejecutar este script?
on:
  workflow_dispatch: # Permite ejecutarlo manualmente desde un botón en la interfaz de GitHub
  schedule:
    - cron: '0 2 * * *' # Opcional: Se ejecuta automáticamente a las 2 AM todos los días

jobs:
  run-crawler:
    runs-on: ubuntu-latest # Una máquina virtual con Linux
    
    steps:
      - name: 📥 Clonar el repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Ejecutar el Crawler de Selenium
        env:
          # Inyecta las credenciales seguras de GitHub Secrets
          BO_USER: ${{ secrets.BO_USER }}
          BO_PASS: ${{ secrets.BO_PASS }}
        run: python crawler_moneda.py
